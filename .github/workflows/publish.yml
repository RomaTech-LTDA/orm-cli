name: Publish to npm

on:
  push:
    branches: ["main"]
    paths:
      - 'src/**'
      - 'package.json'
      - 'tsconfig.json'
  workflow_dispatch:

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check if version already published
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          PUBLISHED=$(npm view "$NAME@$VERSION" version 2>/dev/null || echo "")
          if [ "$PUBLISHED" = "$VERSION" ]; then
            echo "publish=false" >> $GITHUB_OUTPUT
          else
            echo "publish=true" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.publish == 'true'
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
        if: steps.check.outputs.publish == 'true'

      # Raise the @romatech/orm peer range to the latest published release,
      # but never below the range in package.json (fail instead: the CLI
      # needs the features of that release).
      - name: Sync @romatech/orm version
        if: steps.check.outputs.publish == 'true'
        run: |
          ORM_VERSION=$(npm view @romatech/orm version)
          ORM_VERSION="$ORM_VERSION" node -e '
            const fs = require("fs");
            const text = fs.readFileSync("package.json", "utf8");
            const required = JSON.parse(text).peerDependencies["@romatech/orm"].replace(/^[\^~]/, "");
            const latest = process.env.ORM_VERSION;
            const parse = v => v.split("-")[0].split(".").map(Number);
            const [a, b] = [parse(latest), parse(required)];
            const cmp = a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
            if (cmp < 0) {
              console.error(`@romatech/orm ${latest} is older than the required ${required}: publish @romatech/orm first.`);
              process.exit(1);
            }
            fs.writeFileSync("package.json", text.replace(/("@romatech\/orm":\s*")[^"]*"/, `$1^${latest}"`));
          '

      - run: npm run build --if-present
        if: steps.check.outputs.publish == 'true'

      - run: npm test --if-present
        if: steps.check.outputs.publish == 'true'

      - name: Publish
        if: steps.check.outputs.publish == 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag + Release
        if: steps.check.outputs.publish == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.check.outputs.version }}" || true
          git push --tags || true

      - name: GitHub Release
        if: steps.check.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.check.outputs.version }}
          name: v${{ steps.check.outputs.version }}
          generate_release_notes: true